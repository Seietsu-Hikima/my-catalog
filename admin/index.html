<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>作品の管理</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <h1>作品の管理</h1>
    <div class="header-actions">
      <button type="button" id="reload" class="secondary-button">再読み込み</button>
      <button type="button" id="add" class="primary-button">＋新規追加</button>
    </div>
  </header>

  <main class="admin-main">
    <p id="notice" class="notice" role="status" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>
    <p id="loading" class="loading">読み込み中…</p>
    <p id="empty" class="empty" hidden>まだ作品がありません</p>

    <div id="table-wrap" class="table-wrap" hidden>
      <table class="works-table">
        <thead>
          <tr>
            <th scope="col">作品名</th>
            <th scope="col">カテゴリ</th>
            <th scope="col" class="num">価格</th>
            <th scope="col">状態</th>
            <th scope="col"><span class="visually-hidden">操作</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="footnote">新しく追加した作品が上に並びます。「削除済み」の作品は表示されません。</p>
  </main>

  <dialog id="form-dialog" class="admin-dialog" aria-labelledby="form-title">
    <form id="work-form" method="dialog" novalidate>
      <h2 id="form-title">作品を追加</h2>
      <label class="field">
        <span>作品名</span>
        <input type="text" name="name" id="f-name" maxlength="200" autocomplete="off">
      </label>
      <label class="field">
        <span>カテゴリ</span>
        <input type="text" name="category" id="f-category" maxlength="100" list="category-options" autocomplete="off">
        <datalist id="category-options"></datalist>
      </label>
      <label class="field">
        <span>価格（円）</span>
        <input type="text" name="price" id="f-price" inputmode="numeric" placeholder="例：2800" autocomplete="off">
        <small id="price-error" class="field-error" hidden>価格は数字で入力してください（例：2800）</small>
      </label>
      <label class="field">
        <span>写真URL</span>
        <input type="text" name="photo" id="f-photo" placeholder="https://… または images/photo.jpg" autocomplete="off">
      </label>
      <div id="photo-preview" class="photo-preview" hidden><img alt="写真のプレビュー"></div>
      <label class="field">
        <span>説明</span>
        <textarea name="description" id="f-description" rows="4"></textarea>
      </label>
      <p id="form-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="form-cancel" class="secondary-button">キャンセル</button>
        <button type="submit" id="form-save" class="primary-button">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" class="admin-dialog" aria-labelledby="delete-title">
    <h2 id="delete-title">作品を削除しますか？</h2>
    <p>「<strong id="delete-name"></strong>」を一覧から消します。</p>
    <p class="hint">Notion には残り、「削除済み」にチェックが入ります。戻すときは Notion でチェックを外してください。</p>
    <p id="delete-error" class="error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="delete-cancel" class="secondary-button">キャンセル</button>
      <button type="button" id="delete-confirm" class="danger-button">削除する</button>
    </div>
  </dialog>

  <script src="admin.js"></script>
</body>
</html>
